name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Verify tag matches plugin version
        run: |
          version="$(node -p "require('./plugin.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version"
      - run: cd webapp && npm ci
      - run: make check-style test
      - run: make clean
      - run: make dist
      - name: Create checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
