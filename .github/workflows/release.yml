name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.2)'
        required: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Verify tag matches plugin version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./plugin.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version"
      - run: cd webapp && npm ci
      - run: make check-style test
      - run: make clean
      - run: make dist
      - name: Create checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --title "$TAG" --generate-notes
