name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race ./...

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: make clean
      - run: make dist PLUGIN_TARGETS=linux/amd64
      - name: Smoke-check packaged plugin bundle
        run: |
          bundle="dist/com.integrasources.read-receipts-0.2.0.tar.gz"
          tar -tzf "$bundle" | grep -Fx 'com.integrasources.read-receipts/plugin.json'
          tar -tzf "$bundle" | grep -Fx 'com.integrasources.read-receipts/assets/'
          tar -tzf "$bundle" | grep -Fx 'com.integrasources.read-receipts/server/dist/plugin-linux-amd64'
          tar -tzf "$bundle" | grep -Fx 'com.integrasources.read-receipts/webapp/dist/main.js'
